[package]
name = "novasound-ui-egui"
description = "NovaSound's egui user interface: Edit and Mix windows, transport, dialogs, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository.workspace = true

[dependencies]
nova-ui.workspace = true
novasound-time.workspace = true
novasound-audio-io.workspace = true
novasound-midi.workspace = true
novasound-dsp.workspace = true
novasound-clap-host.workspace = true
novasound-vst3-host.workspace = true
novasound-au-host.workspace = true
novasound-model.workspace = true
novasound-mix.workspace = true
novasound-engine.workspace = true
novasound-playback.workspace = true
novasound-video.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[lints]
workspace = true

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nova-account-ui = { git = "https://github.com/EuLucaDev/nova-live", rev = "b5c44c66604d6a6ea210d724c4f1de1bc2c5431b" }
nova-live = { git = "https://github.com/EuLucaDev/nova-live", rev = "b5c44c66604d6a6ea210d724c4f1de1bc2c5431b" }
